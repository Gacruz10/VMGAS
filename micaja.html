<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Caja - Rendición</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
  
  <style>
    :root { 
      --bg: #030508; --surface: #0b1018; --panel: #121a24; 
      --border: rgba(255,255,255,0.1); 
      --text: #c5d4e0; --dim: #546a7b; 
      --accent: #FFD700; --pos: #2dd4bf; --neg: #ff4757; 
      --glass: rgba(18, 26, 36, 0.7);
    }
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
    
    .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 20px; }
    
    /* Header Básico */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .header h1 { font-family: 'Syne', sans-serif; font-size: 22px; color: #fff; }
    .btn-back { background: var(--panel); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }
    
    /* Tarjeta Efectivo Principal */
    .wallet-card { background: linear-gradient(135deg, #0d1b18 0%, #06110f 100%); border: 1px solid rgba(45, 212, 191, 0.3); border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(45, 212, 191, 0.1); position: relative; overflow: hidden; }
    .wallet-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(45, 212, 191, 0.05) 0%, transparent 60%); pointer-events: none; }
    .wallet-lbl { font-size: 12px; font-weight: 800; color: var(--pos); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; display: block; }
    .wallet-amount { font-family: 'Inter', sans-serif; font-size: 48px; font-weight: 900; color: #fff; letter-spacing: -1px; text-shadow: 0 0 20px rgba(45, 212, 191, 0.4); }
    
    /* Secciones de Transferencias */
    .section-title { font-size: 11px; font-weight: 800; color: var(--dim); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; margin-top: 10px; padding-left: 5px; display: flex; justify-content: space-between; align-items: flex-end;}
    .section-count { background: var(--panel); padding: 2px 8px; border-radius: 10px; color: #fff; font-size: 10px; }
    
    .tx-list { display: flex; flex-direction: column; gap: 10px; }
    
    .tx-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .tx-info { display: flex; flex-direction: column; gap: 4px; }
    .tx-cli { font-weight: 700; color: #fff; font-size: 14px; display: flex; align-items: center; gap: 6px;}
    .tx-meta { font-size: 11px; color: var(--dim); display: flex; gap: 8px; font-weight: 600; }
    .tx-amount { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; color: var(--accent); }
    
    /* Variación Urgente (Atrasadas) */
    .urgent-block .section-title { color: var(--neg); }
    .urgent-block .section-count { background: rgba(255, 71, 87, 0.2); color: var(--neg); border: 1px solid rgba(255, 71, 87, 0.4); }
    .tx-card.urgent { border-left: 4px solid var(--neg); background: rgba(255, 71, 87, 0.05); border-color: rgba(255, 71, 87, 0.3); }
    .tx-card.urgent .tx-amount { color: #fff; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-warn { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot-urgent { background: var(--neg); box-shadow: 0 0 8px var(--neg); animation: blink 1.5s infinite; }
    
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Empty State */
    .empty-state { text-align: center; padding: 30px; border: 1px dashed var(--border); border-radius: 12px; color: var(--dim); font-size: 13px; font-weight: 600; }

    /* Loader */
    #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; color: var(--accent); font-weight: 800; letter-spacing: 2px; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255, 215, 0, 0.1); border-left-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header">
      <h1>MI CAJA</h1>
      <a href="#" id="btnVolver" class="btn-back">
        <span class="material-symbols-rounded" style="font-size: 20px;">close</span>
      </a>
    </div>

    <div id="loader">
      <div class="spinner"></div>
      <span>CONSULTANDO...</span>
    </div>

    <div id="content" style="display: none;">
      
      <div class="wallet-card">
        <span class="wallet-lbl">Efectivo a Rendir</span>
        <div class="wallet-amount" id="efectivoTotal">$0</div>
      </div>

      <div id="bloqueAtrasadas" class="urgent-block" style="display: none;">
        <div class="section-title">
          <span>⚠️ FALTAN IMPACTAR (Atrasadas)</span>
          <span class="section-count" id="countAtrasadas">0</span>
        </div>
        <div class="tx-list" id="listaAtrasadas"></div>
      </div>

      <div id="bloqueHoy">
        <div class="section-title">
          <span>Transferencias del Turno</span>
          <span class="section-count" id="countHoy">0</span>
        </div>
        <div class="tx-list" id="listaHoy"></div>
      </div>

    </div>
  </div>

<script src="config2.js"></script>
<script>
const TIMEOUT_SESION = 18000;
 
    const params = new URLSearchParams(window.location.search);
    const k = params.get('k') || params.get('token');

    if (!k) window.location.replace('index.html');
    document.getElementById('btnVolver').href = `inicio.html?k=${k}`;

    async function cargarCaja() {
      try {
        const url = `${API}?action=getmicaja&k=${k}`;
        const res = await fetch(url);
        const json = await res.json();

        if (json.status === 'success') {
          renderizar(json.data);
        } else {
          alert("Error: " + json.message);
        }
      } catch (e) {
        alert("Error de conexión al cargar la caja.");
      }
    }

    function renderizar(data) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      // Efectivo
      document.getElementById('efectivoTotal').textContent = `$${Number(data.efectivo).toLocaleString('es-AR')}`;

      // Atrasadas
      const cAtrasadas = document.getElementById('countAtrasadas');
      const lAtrasadas = document.getElementById('listaAtrasadas');
      const bAtrasadas = document.getElementById('bloqueAtrasadas');
      
      if (data.atrasadas && data.atrasadas.length > 0) {
        bAtrasadas.style.display = 'block';
        cAtrasadas.textContent = data.atrasadas.length;
        lAtrasadas.innerHTML = data.atrasadas.map(tx => buildTxCard(tx, true)).join('');
      }

      // Hoy
      const cHoy = document.getElementById('countHoy');
      const lHoy = document.getElementById('listaHoy');
      
      if (data.hoy && data.hoy.length > 0) {
        cHoy.textContent = data.hoy.length;
        lHoy.innerHTML = data.hoy.map(tx => buildTxCard(tx, false)).join('');
      } else {
        lHoy.innerHTML = `<div class="empty-state">No hay transferencias pendientes en este turno.</div>`;
      }
    }

    function buildTxCard(tx, isUrgent) {
      const urgentClass = isUrgent ? 'urgent' : '';
      const dotClass = isUrgent ? 'dot-urgent' : 'dot-warn';
      const montoFmt = `$${Number(tx.monto).toLocaleString('es-AR')}`;
      
      return `
        <div class="tx-card ${urgentClass}">
          <div class="tx-info">
            <div class="tx-cli"><span class="status-dot ${dotClass}"></span> ${tx.cliente}</div>
            <div class="tx-meta">
              <span>📅 ${tx.fecha}</span> | <span>🏷️ ${tx.tipo}</span>
            </div>
          </div>
          <div class="tx-amount">${montoFmt}</div>
        </div>
      `;
    }

    window.onload = cargarCaja;
  </script>
</body>
</html>
